<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>MasterMine Chat</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fc;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:0 auto;padding:28px 18px}.top{background:linear-gradient(130deg,#172554,#4c1d95);color:white;padding:26px;border-radius:20px;margin-bottom:20px;box-shadow:0 12px 32px #17255416}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:#c7d2fe}.top h1{margin:8px 0;font-size:clamp(26px,4vw,38px)}.top p{margin:0;color:#e0e7ff}.panel{background:#fff;border:1px solid #e1e7f1;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #15264a09}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{font:inherit;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:white;color:#172033}textarea{min-height:200px;resize:vertical;line-height:1.55}button{font:inherit;border:0;border-radius:10px;background:#3156d8;color:white;padding:10px 14px;cursor:pointer;font-weight:700}button:hover{filter:brightness(.96)}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e8edff;color:#223b9b}.danger{background:#fee2e2;color:#991b1b}.muted{color:#64748b;font-size:14px}.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.foot{font-size:12px;color:#64748b;margin:16px 2px}.notice{background:#eef2ff;border-radius:10px;padding:11px 13px;color:#263877;margin:10px 0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.tile{border:1px solid #dbe3f0;border-radius:12px;padding:15px}.tile a{color:#3156d8;font-weight:700}.list{display:grid;gap:8px}.message{padding:12px;border-radius:12px;background:#f1f4ff;overflow-wrap:anywhere}.message small{display:block;color:#64748b;margin-bottom:5px}.sheet-wrap{overflow:auto}.sheet{border-collapse:collapse;width:100%}.sheet th,.sheet td{border:1px solid #cbd5e1;padding:0}.sheet th{background:#eef2ff;padding:8px}.sheet input{border:0;border-radius:0;min-width:78px;padding:9px}.sheet input:focus{outline:2px solid #818cf8;outline-offset:-2px}canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:none;border:1px solid #ccd5e5;border-radius:12px;background:#fff;cursor:crosshair}@media(max-width:520px){.wrap{padding:14px 10px}.top,.panel{padding:16px}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">MASTERMINE • STANDALONE APP</div><h1>💬 MasterMine Chat</h1><p>Post messages to a message board saved in this browser.</p></header><section class="panel" id="app"></section><p class="foot">MasterMine starter app · Data is stored in this browser unless noted. This is not a full cloud service.</p></main>
<script>
(function(){
'use strict';
var APP='chat';
var root=document.getElementById('app');
function read(key,fallback){try{var value=localStorage.getItem(key);return value===null?fallback:JSON.parse(value)}catch(e){return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}}
function download(name,text,type){var url=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'}));var a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeName(s){return (s||'document').replace(/[^a-z0-9-_ ]/gi,'').trim().replace(/\s+/g,'-')||'document'}
if(APP==='docs'){
 var old=read('mm-docs-v1',{title:'My document',body:''});if(!old||typeof old!=='object')old={title:'My document',body:''};
 root.innerHTML='<label for="title">Document title</label><input id="title" value="'+esc(old.title)+'"><label for="body">Document</label><textarea id="body" placeholder="Start writing here…">'+esc(old.body)+'</textarea><div class="spread"><span id="status" class="muted">Autosaves in this browser.</span><div class="row"><button id="save">Save now</button><button id="download">Download .txt</button><button id="clear" class="secondary">New document</button></div></div>';
 var dt=document.getElementById('title'),db=document.getElementById('body'),ds=document.getElementById('status');
 function saveDoc(){var ok=write('mm-docs-v1',{title:dt.value,body:db.value});ds.textContent=ok?'Saved in this browser · '+db.value.length+' characters':'Could not save; browser storage may be full.'}
 dt.addEventListener('input',saveDoc);db.addEventListener('input',saveDoc);document.getElementById('save').onclick=saveDoc;document.getElementById('download').onclick=function(){download(safeName(dt.value)+'.txt',dt.value+'\n\n'+db.value)};document.getElementById('clear').onclick=function(){dt.value='My document';db.value='';saveDoc();db.focus()};
}
if(APP==='slides'){
 var slides=read('mm-slides-v1',[{title:'Welcome',body:'Add your key points here.'}]);if(!Array.isArray(slides)||!slides.length)slides=[{title:'Welcome',body:''}];var si=0;
 function saveSlides(){write('mm-slides-v1',slides)}
 function renderSlides(){var cur=slides[si];root.innerHTML='<div class="spread"><b>Slide '+(si+1)+' of '+slides.length+'</b><div class="row"><button id="prev" class="secondary" '+(si===0?'disabled':'')+'>← Previous</button><button id="next" class="secondary" '+(si===slides.length-1?'disabled':'')+'>Next →</button></div></div><label for="stitle">Slide title</label><input id="stitle" value="'+esc(cur.title)+'"><label for="sbody">Slide content / speaker notes</label><textarea id="sbody">'+esc(cur.body)+'</textarea><div class="row"><button id="add">＋ Add slide</button><button id="remove" class="danger" '+(slides.length<2?'disabled':'')+'>Delete slide</button><button id="outline">Download presentation outline</button></div><p class="muted">Your slides autosave in this browser.</p>';document.getElementById('stitle').oninput=function(e){cur.title=e.target.value;saveSlides()};document.getElementById('sbody').oninput=function(e){cur.body=e.target.value;saveSlides()};document.getElementById('prev').onclick=function(){si=Math.max(0,si-1);renderSlides()};document.getElementById('next').onclick=function(){si=Math.min(slides.length-1,si+1);renderSlides()};document.getElementById('add').onclick=function(){slides.push({title:'Slide '+(slides.length+1),body:''});si=slides.length-1;saveSlides();renderSlides()};document.getElementById('remove').onclick=function(){if(slides.length<2)return;slides.splice(si,1);si=Math.max(0,si-1);saveSlides();renderSlides()};document.getElementById('outline').onclick=function(){download('MasterMine-presentation-outline.txt',slides.map(function(s,i){return 'SLIDE '+(i+1)+': '+s.title+'\n\n'+s.body}).join('\n\n--------------------\n\n'))}}
 renderSlides();
}
if(APP==='sheets'){
 var grid=read('mm-sheets-v1',Array.from({length:5},function(){return Array(5).fill('')}));if(!Array.isArray(grid)||!grid.length)grid=Array.from({length:5},function(){return Array(5).fill('')});
 function colName(n){var s='';while(n>=0){s=String.fromCharCode(n%26+65)+s;n=Math.floor(n/26)-1}return s}
 function calc(raw){if(typeof raw!=='string'||raw.charAt(0)!=='=')return raw;var x=raw.slice(1).trim(),m=/^SUM\(([A-Z]+)(\d+):([A-Z]+)(\d+)\)$/i.exec(x);if(m&&m[1].toUpperCase()===m[3].toUpperCase()){var c=m[1].toUpperCase().split('').reduce(function(n,ch){return n*26+ch.charCodeAt(0)-64},0)-1;var a=+m[2]-1,b=+m[4]-1,total=0;for(var r=Math.min(a,b);r<=Math.max(a,b);r++)total+=Number((grid[r]||[])[c])||0;return String(total)}var ar=/^(-?\d+(?:\.\d+)?)\s*([+\-*/])\s*(-?\d+(?:\.\d+)?)$/.exec(x);if(ar){var n1=+ar[1],n2=+ar[3];if(ar[2]==='+')return String(n1+n2);if(ar[2]==='-')return String(n1-n2);if(ar[2]==='*')return String(n1*n2);if(ar[2]==='/'&&n2!==0)return String(n1/n2)}return '#ERROR'}
 function updateResults(){var out=[];grid.forEach(function(row,r){row.forEach(function(v,c){if(typeof v==='string'&&v.charAt(0)==='=')out.push('<div><b>'+colName(c)+(r+1)+'</b>: '+esc(calc(v))+'</div>')})});var box=document.getElementById('results');if(box)box.innerHTML=out.length?out.join(''):'<span class="muted">Add a formula such as =SUM(B2:B4) or =2+2. Formula results appear here.</span>'}
 function renderGrid(){var cols=Math.max(5,...grid.map(function(r){return r.length}));var s='<table class="sheet"><thead><tr><th>#</th>';for(var c=0;c<cols;c++)s+='<th>'+colName(c)+'</th>';s+='</tr></thead><tbody>';grid.forEach(function(row,r){s+='<tr><th>'+(r+1)+'</th>';for(var c=0;c<cols;c++)s+='<td><input aria-label="Cell '+colName(c)+(r+1)+'" data-r="'+r+'" data-c="'+c+'" value="'+esc(row[c]||'')+'"></td>';s+='</tr>'});s+='</tbody></table>';document.getElementById('grid').innerHTML=s;document.querySelectorAll('.sheet input').forEach(function(input){input.addEventListener('input',function(){var r=+input.dataset.r,c=+input.dataset.c;while(grid.length<=r)grid.push([]);while(grid[r].length<=c)grid[r].push('');grid[r][c]=input.value;write('mm-sheets-v1',grid);updateResults()})});updateResults()}
 root.innerHTML='<p class="muted">Edit cells directly. Formula support: =2+2, =5*3 and =SUM(B2:B4).</p><div class="row"><button id="row">＋ Add row</button><button id="col" class="secondary">＋ Add column</button><button id="csv">Export CSV</button></div><div id="grid" class="sheet-wrap" style="margin-top:14px"></div><section class="notice"><b>Formula results</b><div id="results" style="margin-top:7px"></div></section>';
 document.getElementById('row').onclick=function(){grid.push(Array(Math.max(5,...grid.map(function(r){return r.length}))).fill(''));write('mm-sheets-v1',grid);renderGrid()};document.getElementById('col').onclick=function(){grid.forEach(function(r){r.push('')});write('mm-sheets-v1',grid);renderGrid()};document.getElementById('csv').onclick=function(){download('MasterMine-Sheets.csv',grid.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),'text/csv;charset=utf-8')};renderGrid();
}
if(APP==='studio'){
 root.innerHTML='<p>Draw with your mouse, trackpad or touchscreen.</p><canvas id="canvas" width="900" height="420"></canvas><div class="row" style="margin-top:12px"><label style="margin:0;min-width:150px">Brush colour <input id="colour" type="color" value="#3156d8" style="padding:3px;height:42px"></label><label style="margin:0;min-width:100px">Brush size <input id="size" type="range" min="1" max="24" value="4"></label><button id="clear" class="secondary">Clear canvas</button><button id="png">Download PNG</button></div>';
 var cv=document.getElementById('canvas'),ctx=cv.getContext('2d'),drawing=false;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);function point(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}cv.addEventListener('pointerdown',function(e){drawing=true;var p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=document.getElementById('colour').value;ctx.lineWidth=+document.getElementById('size').value;ctx.lineCap='round';cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});['pointerup','pointercancel','pointerleave'].forEach(function(n){cv.addEventListener(n,function(){drawing=false})});document.getElementById('clear').onclick=function(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)};document.getElementById('png').onclick=function(){var a=document.createElement('a');a.download='MasterMine-art.png';a.href=cv.toDataURL('image/png');a.click()};
}
if(APP==='gx'){
 var links=[['DuckDuckGo','https://duckduckgo.com'],['Wikipedia','https://www.wikipedia.org'],['YouTube','https://www.youtube.com'],['GitHub','https://github.com'],['Cloudflare dashboard','https://dash.cloudflare.com']];
 root.innerHTML='<h2>Search the web</h2><form id="search" class="row"><div style="flex:1 1 250px"><input id="query" placeholder="Search with DuckDuckGo…" aria-label="Search query"></div><button type="submit">Search ↗</button></form><h2 style="margin-top:24px">Quick links</h2><div class="tiles">'+links.map(function(x){return '<div class="tile"><b>'+esc(x[0])+'</b><p><a href="'+x[1]+'" target="_blank" rel="noopener noreferrer">Open '+esc(x[0])+' ↗</a></p></div>'}).join('')+'</div><p class="muted">GX is a web-search launchpad, not a full browser engine.</p>';document.getElementById('search').onsubmit=function(e){e.preventDefault();var q=document.getElementById('query').value.trim();if(q)window.open('https://duckduckgo.com/?q='+encodeURIComponent(q),'_blank','noopener,noreferrer')};
}
if(APP==='drive'){
 root.innerHTML='<label for="files">Choose files from this device</label><input type="file" id="files" multiple><p class="muted">This starter shows file details only. It does not upload file contents to a cloud drive.</p><div class="spread"><h2>Selected files (<span id="count">0</span>)</h2><button class="secondary" id="clear">Clear list</button></div><ul id="filelist"></ul>';
 var selected=[];document.getElementById('files').onchange=function(e){Array.from(e.target.files||[]).forEach(function(f){selected.push({name:f.name,size:f.size,type:f.type||'Unknown type'})});renderFiles();e.target.value=''};function renderFiles(){document.getElementById('count').textContent=selected.length;document.getElementById('filelist').innerHTML=selected.length?selected.map(function(f){return '<li><b>'+esc(f.name)+'</b> — '+(f.size/1024).toLocaleString(undefined,{maximumFractionDigits:1})+' KB <span class="muted">('+esc(f.type)+')</span></li>'}).join(''):'<li class="muted">No files selected yet.</li>'}document.getElementById('clear').onclick=function(){selected=[];renderFiles()};renderFiles();
}
if(APP==='meet'){
 root.innerHTML='<label for="mtitle">Meeting name</label><input id="mtitle" value="MasterMine catch-up"><div class="row"><div style="flex:1 1 180px"><label for="date">Date</label><input type="date" id="date"></div><div style="flex:1 1 180px"><label for="time">Time</label><input type="time" id="time"></div></div><label for="details">Agenda / joining details</label><textarea id="details" style="min-height:110px" placeholder="Add an agenda, location or joining link…"></textarea><div class="row"><button id="make">Create invitation draft</button><button class="secondary" id="copy">Copy invitation</button><button class="secondary" id="download">Download invitation</button></div><label for="invite">Invitation draft</label><textarea id="invite" readonly style="min-height:155px" placeholder="Your invitation will appear here."></textarea><p class="muted">This does not create a live video call or send invitations.</p>';
 function inviteText(){return 'Meeting invitation: '+document.getElementById('mtitle').value+'\nDate: '+(document.getElementById('date').value||'Not set')+'\nTime: '+(document.getElementById('time').value||'Not set')+'\n\nAgenda / details:\n'+(document.getElementById('details').value||'Not provided')+'\n\nCreated with MasterMine Meet. This is a draft only.'}document.getElementById('make').onclick=function(){document.getElementById('invite').value=inviteText()};document.getElementById('copy').onclick=async function(){var text=document.getElementById('invite').value||inviteText();try{await navigator.clipboard.writeText(text);alert('Invitation copied.')}catch(e){alert('Copy is unavailable; use Download invitation instead.')}};document.getElementById('download').onclick=function(){download('MasterMine-meeting-invitation.txt',document.getElementById('invite').value||inviteText())};
}
if(APP==='chat'){
 var messages=read('mm-chat-v1',[]);if(!Array.isArray(messages))messages=[];
 root.innerHTML='<label for="name">Display name</label><input id="name" value="Guest"><form id="send"><label for="message">Message</label><textarea id="message" style="min-height:100px" placeholder="Write a message…"></textarea><div class="row"><button type="submit">Post message</button><button type="button" class="danger" id="clear">Clear board</button></div></form><section style="margin-top:20px"><h2>Messages (<span id="count">0</span>)</h2><div id="messages" class="list"></div></section><p class="muted">This message board is local to this browser; it does not send messages to other users.</p>';
 function renderChat(){document.getElementById('count').textContent=messages.length;document.getElementById('messages').innerHTML=messages.length?messages.slice().reverse().map(function(m){return '<div class="message"><small>'+esc(m.name)+' · '+esc(m.time)+'</small>'+esc(m.text)+'</div>'}).join(''):'<p class="muted">No messages yet. Write the first one above.</p>';write('mm-chat-v1',messages)}
 document.getElementById('send').onsubmit=function(e){e.preventDefault();var text=document.getElementById('message').value.trim();if(!text)return;messages.push({name:document.getElementById('name').value.trim()||'Guest',text:text,time:new Date().toLocaleString()});document.getElementById('message').value='';renderChat()};document.getElementById('clear').onclick=function(){messages=[];renderChat()};renderChat();
}
if(APP==='mail'){
 var drafts=read('mm-mail-v1',[]);if(!Array.isArray(drafts))drafts=[];
 root.innerHTML='<form id="compose"><label for="to">To</label><input id="to" type="email" placeholder="recipient@example.com"><label for="subject">Subject</label><input id="subject" placeholder="Email subject"><label for="body">Message</label><textarea id="body" placeholder="Write your email…"></textarea><div class="row"><button type="submit">Save draft</button><button type="button" id="download-current" class="secondary">Download current draft</button></div></form><section style="margin-top:22px"><div class="spread"><h2>Saved drafts (<span id="count">0</span>)</h2><button type="button" id="clear" class="danger">Clear drafts</button></div><div id="drafts" class="list"></div></section><p class="muted">Drafts are stored in this browser. This app does not send email.</p>';
 function formData(){return{to:document.getElementById('to').value,subject:document.getElementById('subject').value,body:document.getElementById('body').value}}function draftText(d){return 'To: '+d.to+'\nSubject: '+d.subject+'\n\n'+d.body}
 function renderMail(){document.getElementById('count').textContent=drafts.length;document.getElementById('drafts').innerHTML=drafts.length?drafts.map(function(d,i){return '<div class="message"><b>'+esc(d.subject||'(No subject)')+'</b><div class="muted">To: '+esc(d.to||'(No recipient)')+' · '+esc(d.saved)+'</div><p>'+esc(d.body)+'</p><div class="row"><button class="secondary" data-load="'+i+'">Edit</button><button data-download="'+i+'">Download</button><button class="danger" data-delete="'+i+'">Delete</button></div></div>'}).join(''):'<p class="muted">No drafts saved yet.</p>';write('mm-mail-v1',drafts)}
 document.getElementById('compose').onsubmit=function(e){e.preventDefault();var d=formData();d.id=Date.now();d.saved=new Date().toLocaleString();drafts.unshift(d);renderMail();document.getElementById('compose').reset()};document.getElementById('download-current').onclick=function(){download('MasterMine-email-draft.txt',draftText(formData()))};document.getElementById('clear').onclick=function(){drafts=[];renderMail()};document.getElementById('drafts').onclick=function(e){var t=e.target;if(t.dataset.load!==undefined){var d=drafts[+t.dataset.load];document.getElementById('to').value=d.to;document.getElementById('subject').value=d.subject;document.getElementById('body').value=d.body;window.scrollTo({top:0,behavior:'smooth'})}if(t.dataset.download!==undefined)download('MasterMine-email-draft.txt',draftText(drafts[+t.dataset.download]));if(t.dataset.delete!==undefined){drafts.splice(+t.dataset.delete,1);renderMail()}};renderMail();
}
})();
</script></body></html>
